name: impilo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/impilo_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/impilo_logo.png"
  adaptive_icon_background: "#E0FDF9"
  adaptive_icon_foreground: "assets/images/impilo_logo.png"

flutter_native_splash:
  color: "#E0FDF9"
  image: assets/images/impilo_logo.png
  branding_mode: bottom

  android_12:
    color: "#E0FDF9"
    image: assets/images/impilo_logo.png